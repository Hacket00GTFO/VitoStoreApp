name: vito_store_app
description: "Cliente móvil de VITO Technologies (iOS/Android). Replica del diseño de desingVITO, consume el mismo backend Express/Prisma/PostgreSQL."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  dio: ^5.11.0
  go_router: ^17.2.3
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5
  socket_io_client: ^3.1.6
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2
  lucide_icons: ^0.257.0
  flutter_animate: ^4.5.2
  flutter_stripe: ^13.0.0
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.2.0
  intl: ^0.20.2
  flutter_widget_from_html_core: ^0.17.2
  flutter_svg: ^2.3.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # l10n desactivado temporalmente (permisos de OneDrive en l10n/).
  # Reactivar `generate: true` cuando el proyecto no esté bajo OneDrive
  # o se mueva l10n/ a una ruta local. Fase 8 del plan.
  # generate: true

  assets:
    - assets/images/
    # Nota: las fuentes Montserrat se cargan vía google_fonts en runtime.
    # Para producción, descargar los .ttf a assets/fonts/ y descomentar la
    # sección 'fonts:' inferior para empaquetarlas offline.
  # fonts:
  #   - family: Montserrat
  #     fonts:
  #       - asset: assets/fonts/Montserrat-Regular.ttf
  #       - asset: assets/fonts/Montserrat-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Montserrat-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Montserrat-Bold.ttf
  #         weight: 700
