# Contenedor `vitostoreapp`: sirve la app Flutter Web compilada y
# redirige `/api` (y `/uploads`, que el backend puede referenciar sin prefijo)
# al contenedor vito-api. Así la web de la app queda en el MISMO origen que la
# API: sin CORS y lista para el túnel cloudflared.
#
# La salida `vito_store_app/build/web` se monta read-only en /usr/share/nginx/html
# VER docker-compose.cloudflared.yml (no se copia en la imagen para que
# `flutter build web` + `docker compose up -d vitostoreapp` actualice sin rebuild).
server {
    listen 80;
    server_name _;

    # --- API del backend (mismo origen) ---
    # /api/... → vito-api:3001/api/... (proxy transparente, headers/ws ok)
    location /api/ {
        proxy_pass http://vito-api:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 60m;
    }

    # Socket.io (namespace de la web) si se activa en Fase 2.8.
    location /socket.io/ {
        proxy_pass http://vito-api:3001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # Archivos estáticos con cache agresiva (hash en el nombre).
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|webp|wasm|ttf)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier ruta la atiende index.html (go_router + deep links).
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # No exponer archivos internos del build dart.
    location ~* \.(?:dart|map|DS_Store)$ {
        return 404;
    }
}
